[tool.poetry]
name = "iso20022-evidence-pack-mcp"
version = "0.0.3"
description = "MCP server that compiles ISO 20022 readiness findings, remediation diffs, and simulated responses into sealed audit evidence packs."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/iso20022-evidence-pack-mcp"
homepage = "https://sebastienrousseau.github.io/iso20022-evidence-pack-mcp/"
keywords = ["iso20022", "mcp", "audit", "evidence", "compliance", "payments"]
packages = [
    { include = "iso20022_evidence_pack_mcp" },
]

[tool.poetry.scripts]
iso20022-evidence-pack-mcp = "iso20022_evidence_pack_mcp.server:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
mcp = ">=1.28.1,<3"
pydantic = ">=2.9,<3"
# Ed25519 signing/verification of evidence packs (evidence_pack_mcp.signing).
cryptography = ">=50.0.0,<51"
# Optional streamable-HTTP transport (iso20022_evidence_pack_mcp.http):
# OAuth 2.1 resource-server JWT validation needs PyJWT; [crypto] guarantees
# RSA/EC JWKS support. httpx fetches the JWKS; starlette/uvicorn serve ASGI.
pyjwt = { version = ">=2.10,<3", extras = ["crypto"] }
httpx = ">=0.27,<1"
starlette = ">=1.3.1,<2"
uvicorn = ">=0.30,<1"
# Opt-in cloud/KMS tools (iso20022_evidence_pack_mcp.cloud). These are OFF by
# default so the base install has no cloud network surface; enable them with
# the matching extra below. Imported lazily inside each tool.
boto3 = { version = ">=1.34,<2", optional = true }
hvac = { version = ">=2.0,<3", optional = true }
# Opt-in OpenTelemetry tracing (iso20022_evidence_pack_mcp.tracing). OFF by
# default so the base install pulls no tracing SDK; enable with the [otel]
# extra. Imported lazily inside init_tracing.
opentelemetry-sdk = { version = ">=1.27,<2", optional = true }
opentelemetry-exporter-otlp-proto-http = { version = ">=1.27,<2", optional = true }

[tool.poetry.extras]
# `pip install iso20022-evidence-pack-mcp[aws]`   -> AWS KMS signing + S3 export
# `pip install iso20022-evidence-pack-mcp[vault]` -> Vault Transit signing
# `pip install iso20022-evidence-pack-mcp[otel]`  -> OpenTelemetry tracing
aws = ["boto3"]
vault = ["hvac"]
otel = ["opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-asyncio = ">=0.24,<2.0"
pytest-cov = ">=6.0.0,<8.0.0"
black = "^26.3.1"
ruff = ">=0.1,<0.17"
mypy = ">=1.11,<3.0"
interrogate = "^1.7"
bandit = "^1.7.0"
# Cloud extras + AWS mocking, so the cloud-tool tests can import and mock them.
boto3 = ">=1.34,<2"
hvac = ">=2.0,<3"
moto = { version = ">=5.0,<6", extras = ["s3", "kms"] }
# OpenTelemetry tracing extra, exercised (with an in-memory exporter) by the
# tracing tests.
opentelemetry-sdk = ">=1.27,<2"
opentelemetry-exporter-otlp-proto-http = ">=1.27,<2"

[tool.interrogate]
fail-under = 100
ignore-init-module = true
ignore-magic = true
verbose = 1

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "strict"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=iso20022_evidence_pack_mcp",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    "-m", "not perf and not stress",
]
markers = [
    "perf: performance/benchmark tests (excluded from the coverage gate)",
    "stress: load/stress and soak tests (excluded from the coverage gate)",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = [".venv/", ".eggs/"]

# The MCP server object comes from _mcp_compat, which returns either
# mcp 2.x's MCPServer or mcp 1.x's FastMCP and is therefore typed Any,
# so @server.tool()/@server.resource() read as untyped decorators. The
# decorated functions themselves are fully annotated.
[[tool.mypy.overrides]]
module = "iso20022_evidence_pack_mcp.server"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "hvac.*", "moto.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
